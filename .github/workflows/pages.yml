name: Deploy example site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a running deploy finish instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # dist/ is gitignored; build explicitly so the site never depends on install hooks
      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # keep the folder layout so the pages' relative ../dist/ links keep working
          cp -r examples _site/examples
          cp -r docs _site/docs
          cp -r dist _site/dist
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=examples/"><link rel="canonical" href="examples/"><title>dqcss</title><a href="examples/">dqcss example site</a>' > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
